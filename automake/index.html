<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Automake · draw a wall, a network fills it in</title>
<meta name="description" content="Drag a wall and its openings; a neural network writes every part of it, live, in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='3' width='6' height='3' fill='%23c9bda6'/%3E%3Crect x='8' y='3' width='7' height='3' fill='%23c9bda6'/%3E%3Crect x='1' y='7' width='3' height='3' fill='%23e8e6e1'/%3E%3Crect x='5' y='7' width='6' height='3' fill='%23c9bda6'/%3E%3Crect x='12' y='7' width='3' height='3' fill='%23e8e6e1'/%3E%3Crect x='1' y='11' width='14' height='3' fill='%23c9bda6'/%3E%3C/svg%3E">
<script src="coi-serviceworker.min.js"></script><!-- MIT, Guido Zuidhof: shared memory for the model threads on hosts without COOP/COEP headers -->
<style>
* { box-sizing: border-box }
body { margin: 0; min-height: 100vh; background: #fff; color: #111; display: flex; flex-direction: column; justify-content: center;
  padding: env(safe-area-inset-top, 0) 24px calc(10px + env(safe-area-inset-bottom, 0));
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Arial, sans-serif; -webkit-font-smoothing: antialiased }
main { width: 100%; max-width: 1060px; margin: auto; display: flex; flex-direction: column; gap: 26px; padding: 24px 0 }
canvas { display: block; width: 100%; aspect-ratio: 2.3; min-height: 200px; max-height: 64vh; touch-action: none; outline: none; -webkit-tap-highlight-color: transparent }
canvas[hidden] { display: none }
p { margin: 0; text-align: center; color: #8d8d88; font-size: 13.5px }
.bar { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px }
#caption, #status { font-size: 11px; letter-spacing: .14em; text-transform: uppercase }
#status { color: #aaa; letter-spacing: .08em; margin-top: 4px; min-height: 1.5em }
.pills { display: flex; flex-wrap: wrap; gap: 8px }
button, select { font: inherit; font-size: 13px; line-height: 1.2; color: #111; background: #fff; border: 1px solid #e2e2de;
  border-radius: 999px; padding: 9px 16px; cursor: pointer; appearance: none; -webkit-appearance: none }
select { padding-right: 32px; background-image: linear-gradient(45deg, transparent 50%, #111 50%), linear-gradient(135deg, #111 50%, transparent 50%);
  background-position: right 17px center, right 13px center; background-size: 4px 4px; background-repeat: no-repeat }
button:hover { border-color: #bbb }
/* the inventory: one small toggle per section of the timber catalogue, black where the design has that section */
#inv { justify-content: center; gap: 6px }
#inv button { padding: 7px 13px; font-size: 12px; color: #9a9a95 }
#inv button.on { background: #111; border-color: #111; color: #fff }
#inv[hidden] { display: none }
.sw { display: inline-flex; align-items: center; gap: 9px; padding: 0 4px; cursor: pointer;
  font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #c3c3be; -webkit-user-select: none; user-select: none }
.sw.frame .t, .sw.block .b, .sw.off .t, .sw.on .b { color: #111 }
.sw[hidden] { display: none }
#script, #view { appearance: none; -webkit-appearance: none; position: relative; margin: 0; width: 50px; height: 30px; flex: none;
  border-radius: 999px; background: #e2e2de; cursor: pointer; transition: background .15s ease }
#script::after, #view::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.28); transition: transform .15s ease }
#script:checked, #view:checked { background: #111 }
#script:checked::after, #view:checked::after { transform: translateX(20px) }
button:focus-visible, select:focus-visible, #script:focus-visible, #view:focus-visible { outline: 2px solid #111; outline-offset: 2px }
footer { text-align: center; color: #c3c3be; font-size: 11px; letter-spacing: .06em; padding: 10px 0 }
@media (max-width: 620px) {
  body { padding-left: 12px; padding-right: 12px }
  main { gap: 16px; padding: 10px 0 }
  .bar { flex-direction: column; align-items: center; gap: 12px }
  .pills { justify-content: center }
}
#load{height:3px;width:220px;max-width:60vw;background:#e8e8e8;margin-top:8px;border-radius:2px;overflow:hidden}#load i{display:block;height:100%;width:0;background:#3b8cff;box-shadow:0 0 6px #6fb2ff;transition:width .15s}#load[hidden]{display:none}
.back{position:fixed;top:18px;left:22px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#888;text-decoration:none}.back:hover{color:#111}
.back.right{left:auto;right:22px}#about{max-width:64ch;margin:0 auto;line-height:1.65;text-align:left}#about[hidden]{display:none}
</style>
</head>
<body>
<main>
  <a class="back" href="../">← artifacts</a>
  <a class="back right" id="aboutLink" href="#" hidden>about</a>
  <canvas id="canvas" tabindex="0" aria-label="The wall: drag the crosses at its corners, and its openings"></canvas>
  <canvas id="gl" aria-label="The wall in three dimensions: drag to turn it" hidden></canvas>
  <p>A neural network writes the wall, part by part, in your browser. <span id="hint">Drag the wall and its openings.</span></p>
  <div class="bar">
    <div><div id="caption"></div><div id="status" role="status"></div><div id="load" hidden><i></i></div></div>
    <div class="pills">
      <button id="addDoor" type="button">+ door</button>
      <button id="addWindow" type="button">+ window</button>
      <button id="random" type="button">↻ random</button>
      <button id="rake" type="button">+ rake</button>
      <label class="sw off" id="vsw"><span class="t">2D</span><input type="checkbox" id="view" aria-label="See the wall in three dimensions"><span class="b">3D</span></label>
      <label class="sw" id="sw"><span class="t">timber</span><input type="checkbox" id="script" aria-label="Build concrete blocks instead of a timber frame"><span class="b">blocks</span></label>
    </div>
  </div>
  <div class="pills" id="inv" hidden></div>
  <p id="about" hidden></p>
</main>
<footer>© 2026 Karl-Johan Sørensen</footer>
<script type="module" src="js/app.js"></script>
</body>
</html>
